<div class="dropdown-root" style="position: absolute; top: 16px; left: 16px; z-index: 1000;">
  <div (click)="toggleDropdown($event)" style="cursor:pointer; display: flex; align-items: center;">
    <span style="font-size: 2rem; color: #fff;">&#9776;</span>
  </div>
  <div *ngIf="showDropdown" class="dropdown-menu" (click)="$event.stopPropagation()">
    <div *ngIf="router.url !== '/'" (click)="goToForside()" class="dropdown-option">Koordinatorskærm</div>
    <div *ngIf="router.url !== '/location-db'" (click)="goToLocationDb()" class="dropdown-option">AP lokationsdatabase</div>
    <div *ngIf="router.url !== '/regionh-tracker'" (click)="goToRegionhTracker()" class="dropdown-option">Region H tracker</div>
    <div *ngIf="router.url !== '/prototypetracker'" (click)="goToPrototypetracker()" class="dropdown-option">Prototypetracker</div>
    <div *ngIf="router.url !== '/bssid-scans'" (click)="goToBssidScans()" class="dropdown-option">BSSID scans</div>
    <div *ngIf="router.url !== '/vogndepot-flow'" (click)="goToVogndepotFlow()" class="dropdown-option">Vogndepot flow 3D</div>
    <div (click)="openBulkModal()" class="dropdown-option">Opret flere</div>
  </div>
</div>
